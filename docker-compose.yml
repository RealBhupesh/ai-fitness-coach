services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fitcoach
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - fitcoach-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fitcoach"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    command: sh -c "npm run db:migrate && npm start"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/fitcoach
      DATABASE_SSL: "false"
      BETTER_AUTH_SECRET: replace-with-a-long-random-secret-at-least-32-chars
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      TRUSTED_ORIGINS: http://localhost:3000
      ENABLE_DEMO_MODE: "false"
      NEXT_PUBLIC_ENABLE_DEMO_MODE: "false"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  fitcoach-postgres:
