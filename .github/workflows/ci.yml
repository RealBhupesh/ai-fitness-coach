name: Production beta checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: fitcoach_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:test-only@localhost:5432/fitcoach_test
      TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/fitcoach_test
      BETTER_AUTH_SECRET: ci-local-testing-secret-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      TRUSTED_ORIGINS: http://127.0.0.1:3100
      ENABLE_DEMO_MODE: "false"
      NEXT_PUBLIC_ENABLE_DEMO_MODE: "false"
      E2E_REAL_DATABASE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ml
      - run: npm run db:check
      - run: npm run db:verify
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:prod
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
